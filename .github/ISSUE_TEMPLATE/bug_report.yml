name: Bug Report
description: File a bug report for Ember
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open app
        2. Tap on ...
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device model, OS version, app version (e.g., Pixel 7 Android 14, Ember 1.0.0)
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "S1: Crash or data loss"
        - "S2: Core flow broken (SOS, slip, timer)"
        - "S3: Minor feature defect"
        - "S4: Cosmetic or visual glitch"
    validations:
      required: true
